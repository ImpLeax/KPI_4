<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="meta.notFoundTitle"></title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/pages/not-found.js"></script>
  </head>
  <body class="min-h-dvh">
    <a href="#main" class="skip-link" data-i18n="nav.skip"></a>
    <div id="site-header"></div>
    <main id="main" tabindex="-1" class="container-page mt-6 focus:outline-none">
      <section
        class="flex flex-col items-center rounded-[2rem] bg-sage-200 px-6 py-20 text-center"
        aria-labelledby="not-found-title"
        data-testid="not-found"
      >
        <span class="flex size-16 items-center justify-center rounded-full bg-paper text-forest">
          <span data-icon="sprout" data-icon-class="size-8"></span>
        </span>
        <h1 id="not-found-title" class="mt-5 text-4xl text-ink" data-i18n="notFound.title"></h1>
        <p class="mt-3 max-w-md text-ink" data-i18n="notFound.text"></p>
        <a href="/" class="btn btn-primary mt-7" data-i18n="notFound.back"></a>
      </section>
    </main>
    <div id="site-footer"></div>
  </body>
</html>
