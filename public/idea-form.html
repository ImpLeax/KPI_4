<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="meta.formCreateTitle"></title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/pages/idea-form.js"></script>
  </head>
  <body class="min-h-dvh">
    <a href="#main" class="skip-link" data-i18n="nav.skip"></a>
    <div id="site-header"></div>

    <main id="main" tabindex="-1" class="focus:outline-none">
      <div class="relative overflow-hidden pb-20 sm:pb-24">
        <svg
          class="pointer-events-none absolute inset-y-0 right-0 hidden h-full w-[38%] text-sage-300 md:block"
          viewBox="0 0 600 400"
          preserveAspectRatio="none"
          aria-hidden="true"
          focusable="false"
        >
          <path fill="currentColor" d="M150 0C90 60 170 120 110 200C60 270 0 300 20 400H600V0Z" />
        </svg>
        <div class="container-page relative">
          <a
            id="form-back"
            href="/"
            class="inline-flex min-h-11 items-center gap-2 rounded-full pr-3 font-bold text-forest-dark underline-offset-4 hover:underline"
          >
            <span data-icon="arrowLeft" data-icon-class="size-5"></span>
            <span id="form-back-label" data-i18n="idea.back"></span>
          </a>
          <h1
            id="form-title"
            class="mt-3 text-4xl text-ink sm:text-5xl"
            data-i18n="form.createTitle"
          ></h1>
          <p
            id="form-lead"
            class="mt-4 max-w-[46ch] text-lg text-ink-muted"
            data-i18n="form.createLead"
          ></p>
          <p class="mt-3 max-w-[60ch] text-sm text-ink-muted">
            <span data-i18n="form.requiredNote"></span>
            <span id="lang-note" data-i18n="form.langNote"></span>
          </p>
        </div>
        <svg
          class="pointer-events-none absolute inset-x-0 bottom-0 h-14 w-full sm:h-20"
          viewBox="0 0 1440 120"
          preserveAspectRatio="none"
          aria-hidden="true"
          focusable="false"
        >
          <path
            class="fill-sage-200"
            d="M0 64C220 10 420 18 640 52C880 90 1120 96 1440 30V120H0Z"
          />
          <path class="fill-cream" d="M0 92C260 52 480 60 720 84C960 108 1200 110 1440 70V120H0Z" />
        </svg>
      </div>

      <div class="container-page">
        <div id="form-loading" class="flex flex-col gap-4" role="status" aria-busy="true">
          <span class="sr-only" data-i18n="form.loading"></span>
          <div class="skeleton h-64 w-full rounded-[2rem]" aria-hidden="true"></div>
          <div class="skeleton h-64 w-full rounded-[2rem]" aria-hidden="true"></div>
        </div>

        <section
          id="form-not-found"
          class="flex flex-col items-center rounded-[2rem] bg-sage-200 px-6 py-16 text-center"
          aria-labelledby="form-not-found-title"
          data-testid="not-found"
          hidden
        >
          <span class="flex size-16 items-center justify-center rounded-full bg-paper text-forest">
            <span data-icon="sprout" data-icon-class="size-8"></span>
          </span>
          <h2
            id="form-not-found-title"
            class="mt-5 text-3xl text-ink"
            data-i18n="idea.notFoundTitle"
          ></h2>
          <p class="mt-3 max-w-md text-ink" data-i18n="idea.notFoundText"></p>
          <a href="/" class="btn btn-primary mt-7" data-i18n="idea.toCatalog"></a>
        </section>

        <p
          id="form-dict-error"
          class="rounded-2xl bg-danger-soft px-5 py-4 font-semibold text-ink"
          role="alert"
          hidden
        ></p>

        <form
          id="idea-form"
          class="mx-auto flex max-w-4xl flex-col gap-8"
          novalidate
          data-testid="idea-form"
          hidden
        >
          <div
            id="error-summary"
            class="rounded-[1.5rem] border-2 border-danger bg-danger-soft p-5 sm:p-6"
            role="alert"
            tabindex="-1"
            aria-labelledby="error-summary-title"
            data-testid="error-summary"
            hidden
          >
            <h2 id="error-summary-title" class="flex items-center gap-2 text-xl text-ink">
              <span data-icon="alert" data-icon-class="size-6 text-danger"></span>
              <span data-i18n="form.errorSummaryTitle"></span>
            </h2>
            <p class="mt-1 text-ink" data-i18n="form.errorSummaryText"></p>
            <ul
              id="error-summary-list"
              class="mt-3 flex list-disc flex-col gap-1 pl-6 text-ink"
            ></ul>
          </div>

          <!-- Basics -->
          <fieldset class="rounded-[2rem] border border-line bg-paper p-5 shadow-soft sm:p-8">
            <legend
              class="float-left mb-5 w-full font-display text-2xl font-bold text-ink"
              data-i18n="form.basics"
            ></legend>
            <div class="clear-both grid gap-6 sm:grid-cols-2">
              <div class="sm:col-span-2">
                <label for="title" class="field-label">
                  <span data-i18n="form.title"></span>
                  <span class="text-danger" aria-hidden="true">*</span>
                </label>
                <input
                  id="title"
                  name="title"
                  type="text"
                  class="input"
                  maxlength="120"
                  required
                  aria-describedby="title-hint err-title"
                  data-testid="field-title"
                />
                <p id="title-hint" class="field-hint" data-i18n="form.titleHint"></p>
                <p id="err-title" class="field-error" hidden></p>
              </div>

              <div>
                <label for="category" class="field-label">
                  <span data-i18n="form.category"></span>
                  <span class="text-danger" aria-hidden="true">*</span>
                </label>
                <select
                  id="category"
                  name="category"
                  class="input"
                  required
                  aria-describedby="err-category"
                  data-testid="field-category"
                >
                  <option value="" data-i18n="form.categoryPlaceholder"></option>
                  <option value="decor" data-i18n="category.decor"></option>
                  <option value="storage" data-i18n="category.storage"></option>
                  <option value="garden" data-i18n="category.garden"></option>
                  <option value="toys" data-i18n="category.toys"></option>
                  <option value="accessories" data-i18n="category.accessories"></option>
                  <option value="household" data-i18n="category.household"></option>
                </select>
                <p id="err-category" class="field-error" hidden></p>
              </div>

              <div>
                <label for="estimatedTime" class="field-label">
                  <span data-i18n="form.time"></span>
                  <span class="text-danger" aria-hidden="true">*</span>
                </label>
                <div class="relative">
                  <input
                    id="estimatedTime"
                    name="estimatedTime"
                    type="number"
                    inputmode="numeric"
                    min="1"
                    max="1440"
                    step="1"
                    class="input pr-14"
                    required
                    aria-describedby="time-hint err-estimatedTime"
                    data-testid="field-time"
                  />
                  <span
                    class="pointer-events-none absolute inset-y-0 right-4 flex items-center text-ink-muted"
                    aria-hidden="true"
                    data-i18n="form.minutesSuffix"
                  ></span>
                </div>
                <p id="time-hint" class="field-hint" data-i18n="form.timeHint"></p>
                <p id="err-estimatedTime" class="field-error" hidden></p>
              </div>

              <div
                class="sm:col-span-2"
                role="radiogroup"
                aria-labelledby="difficulty-label"
                aria-describedby="err-difficulty"
                id="difficulty-group"
              >
                <p id="difficulty-label" class="field-label">
                  <span data-i18n="form.difficulty"></span>
                  <span class="text-danger" aria-hidden="true">*</span>
                </p>
                <div class="flex flex-wrap gap-2" data-testid="field-difficulty">
                  <label class="chip">
                    <input type="radio" name="difficulty" value="easy" id="difficulty-easy" />
                    <span data-icon="check" data-icon-class="chip-check size-4"></span>
                    <span data-i18n="difficulty.easy"></span>
                  </label>
                  <label class="chip">
                    <input type="radio" name="difficulty" value="medium" id="difficulty-medium" />
                    <span data-icon="check" data-icon-class="chip-check size-4"></span>
                    <span data-i18n="difficulty.medium"></span>
                  </label>
                  <label class="chip">
                    <input type="radio" name="difficulty" value="hard" id="difficulty-hard" />
                    <span data-icon="check" data-icon-class="chip-check size-4"></span>
                    <span data-i18n="difficulty.hard"></span>
                  </label>
                </div>
                <p id="err-difficulty" class="field-error" hidden></p>
              </div>

              <div class="sm:col-span-2">
                <div class="flex items-baseline justify-between gap-3">
                  <label for="description" class="field-label" data-i18n="form.description"></label>
                  <span
                    id="description-count"
                    class="text-sm text-ink-muted"
                    aria-hidden="true"
                  ></span>
                </div>
                <textarea
                  id="description"
                  name="description"
                  rows="4"
                  maxlength="1000"
                  class="input"
                  aria-describedby="description-hint err-description"
                  data-testid="field-description"
                ></textarea>
                <p id="description-hint" class="field-hint" data-i18n="form.descriptionHint"></p>
                <p id="err-description" class="field-error" hidden></p>
              </div>
            </div>
          </fieldset>

          <!-- Materials -->
          <fieldset
            id="materials-fieldset"
            class="rounded-[2rem] bg-sage-200 p-5 sm:p-8"
            aria-describedby="materials-hint err-materials"
            data-testid="field-materials"
          >
            <legend class="float-left w-full font-display text-2xl font-bold text-ink">
              <span data-i18n="form.materials"></span>
              <span class="text-danger" aria-hidden="true">*</span>
            </legend>
            <p
              id="materials-hint"
              class="clear-both mt-1 text-ink-muted"
              data-i18n="form.materialsHint"
            ></p>
            <p id="err-materials" class="field-error" tabindex="-1" hidden></p>
            <div id="materials-list" class="mt-5 grid gap-5 md:grid-cols-2"></div>
          </fieldset>

          <!-- Tools -->
          <fieldset
            id="tools-fieldset"
            class="rounded-[2rem] border border-line bg-paper p-5 shadow-soft sm:p-8"
            aria-describedby="tools-hint err-tools"
            data-testid="field-tools"
          >
            <legend
              class="float-left w-full font-display text-2xl font-bold text-ink"
              data-i18n="form.tools"
            ></legend>
            <p
              id="tools-hint"
              class="clear-both mt-1 text-ink-muted"
              data-i18n="form.toolsHint"
            ></p>
            <p id="err-tools" class="field-error" tabindex="-1" hidden></p>
            <div id="tools-list" class="mt-5 flex flex-wrap gap-2"></div>
          </fieldset>

          <!-- Steps -->
          <fieldset
            id="steps-fieldset"
            class="rounded-[2rem] border border-line bg-paper p-5 shadow-soft sm:p-8"
            aria-describedby="steps-hint err-steps"
          >
            <legend class="float-left w-full font-display text-2xl font-bold text-ink">
              <span data-i18n="form.steps"></span>
              <span class="text-danger" aria-hidden="true">*</span>
            </legend>
            <p
              id="steps-hint"
              class="clear-both mt-1 text-ink-muted"
              data-i18n="form.stepsHint"
            ></p>
            <p id="err-steps" class="field-error" tabindex="-1" hidden></p>
            <ol id="steps-list" class="mt-5 flex flex-col gap-4" data-testid="step-editor"></ol>
            <button id="add-step" type="button" class="btn btn-ghost mt-5" data-testid="add-step">
              <span data-icon="plus" data-icon-class="size-5"></span>
              <span data-i18n="form.addStep"></span>
            </button>
          </fieldset>

          <!-- Photo -->
          <fieldset
            class="rounded-[2rem] border border-line bg-paper p-5 shadow-soft sm:p-8"
            data-testid="field-photo"
          >
            <legend class="float-left w-full font-display text-2xl font-bold text-ink">
              <span data-i18n="form.photo"></span>
              <span id="photo-required-mark" class="text-danger" aria-hidden="true">*</span>
            </legend>
            <div class="clear-both mt-2 grid items-center gap-6 sm:grid-cols-[minmax(0,16rem)_1fr]">
              <div class="blob-frame aspect-[5/4] w-full overflow-hidden bg-sage-100">
                <img id="photo-preview" class="h-full w-full object-cover" alt="" hidden />
                <div
                  id="photo-empty"
                  class="flex h-full w-full items-center justify-center text-sage-400"
                >
                  <span data-icon="upload" data-icon-class="size-10"></span>
                </div>
              </div>
              <div>
                <label for="photo" class="btn btn-forest">
                  <span data-icon="upload" data-icon-class="size-5"></span>
                  <span id="photo-button-label" data-i18n="form.photoChoose"></span>
                </label>
                <input
                  id="photo"
                  name="photo"
                  type="file"
                  accept="image/jpeg,image/png,image/webp"
                  class="sr-only"
                  aria-describedby="photo-hint err-photo"
                  data-testid="field-photo-input"
                />
                <p
                  id="photo-file-name"
                  class="mt-3 font-semibold text-ink [overflow-wrap:anywhere]"
                  hidden
                ></p>
                <p id="photo-hint" class="field-hint" data-i18n="form.photoHint"></p>
                <p id="err-photo" class="field-error" hidden></p>
              </div>
            </div>
          </fieldset>

          <p
            id="form-error"
            class="rounded-2xl bg-danger-soft px-5 py-4 font-semibold text-ink"
            role="alert"
            hidden
          ></p>

          <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
            <a id="form-cancel" href="/" class="btn btn-ghost" data-i18n="form.cancel"></a>
            <button
              id="form-submit"
              type="submit"
              class="btn btn-primary px-8 text-lg"
              data-testid="form-submit"
            >
              <span id="form-submit-label" data-i18n="form.submitCreate"></span>
            </button>
          </div>
        </form>
      </div>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
